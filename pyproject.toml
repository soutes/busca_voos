[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "busca-voos"
version = "0.1.0"
description = "Monitor de passagens aereas: Google Flights, Skyscanner, Trip.com e Skiplagged, com alerta por e-mail."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "playwright>=1.45",
]

[project.optional-dependencies]
# extras do painel web (busca-voos painel); o daemon roda sem isto
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
busca-voos = "busca_voos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
busca_voos = [
    "painel.html",
    "static/css/*.css",
    "static/fonts/*.woff2",
    "static/img/*.svg",
]